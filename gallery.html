<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예인 결과 갤러리</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --tx:#e8eaf0; --dim:#9aa3b2; --accent:#7aa2ff; --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.95);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-top,0)/3);
    display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;font-weight:700}
  .wrap{padding:16px;max-width:860px;margin:0 auto;
    padding-bottom:calc(90px + env(safe-area-inset-bottom,0))}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--tx);padding:10px 14px;transition:.12s}
  button:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:700}
  .btn-sm{padding:7px 11px;font-size:13px;border-radius:8px}
  input,textarea{font:inherit;width:100%;background:var(--panel);color:var(--tx);
    border:1px solid var(--line);border-radius:10px;padding:12px}
  textarea{resize:vertical;line-height:1.6;min-height:76px;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-bottom:16px}
  .thumb{width:100%;display:block;background:#000;max-height:52vh;object-fit:contain}
  .body{padding:14px 16px}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.03em}
  .b-img{background:rgba(122,162,255,.16);color:var(--accent)}
  .b-loop{background:rgba(74,222,128,.14);color:var(--ok)}
  .b-video{background:rgba(251,191,36,.14);color:var(--warn)}
  .title{font-size:16px;font-weight:700;flex:1}
  .verdict{color:var(--dim);font-size:13.5px;margin:6px 0 2px}
  .verdict b{color:var(--tx)}
  .meta{color:#6b7280;font-size:12px}
  .choices{display:flex;gap:8px;margin-top:12px}
  .choices button{flex:1;font-size:13px;padding:11px 6px}
  .sel-rework{background:rgba(248,113,113,.16);border-color:var(--err);color:var(--err);font-weight:700}
  .sel-hold{background:rgba(251,191,36,.16);border-color:var(--warn);color:var(--warn);font-weight:700}
  .sel-go{background:rgba(74,222,128,.16);border-color:var(--ok);color:var(--ok);font-weight:700}
  .notes{margin-top:10px;display:none}
  .notes.show{display:block}
  .status{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px}
  .st-reworking{background:rgba(248,113,113,.14);color:var(--err)}
  .st-held{background:rgba(251,191,36,.14);color:var(--warn)}
  .st-continued{background:rgba(74,222,128,.14);color:var(--ok)}
  .st-done{background:rgba(74,222,128,.14);color:var(--ok)}
  .msg{padding:11px 14px;border-radius:10px;margin:12px 0;font-size:14px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);color:var(--ok)}
  .msg.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:var(--err)}
  .msg.info{background:rgba(122,162,255,.1);border:1px solid rgba(122,162,255,.3);color:var(--accent)}
  .empty{color:var(--dim);text-align:center;padding:60px 20px}
  .savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.97);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));display:flex;gap:10px;
    max-width:860px;margin:0 auto}
  .savebar button{flex:1}
  .tokwrap{padding:16px;max-width:520px;margin:0 auto}
  .tokwrap li{margin:7px 0;color:var(--dim);font-size:14px}
  code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px;word-break:break-all}
  a{color:var(--accent)}
  .hide{display:none!important}
  .pill{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>🎬 예인 결과 갤러리</h1>
  <span id="saveStat" class="pill"></span>
  <span id="count" class="pill"></span>
  <button id="btnReload" class="btn-sm">새로고침</button>
  <button id="btnTok" class="btn-sm">토큰</button>
</header>

<!-- 토큰 화면 -->
<section id="viewToken" class="tokwrap hide">
  <div class="msg info show">가사 편집기에서 토큰을 이미 넣었다면 여기서도 바로 됩니다(같은 브라우저).</div>
  <ol class="tokwrap">
    <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기</a> — <code>ye-in-project</code> 저장소 · Contents <b>Read and write</b></li>
    <li>아래에 붙여넣기</li>
  </ol>
  <input id="tokIn" type="password" placeholder="github_pat_..." autocomplete="off">
  <div style="display:flex;gap:10px;margin-top:12px">
    <button id="btnSaveTok" class="btn-primary" style="flex:1">저장</button>
    <button id="btnDelTok" style="flex:1">삭제</button>
  </div>
  <div id="tokMsg" class="msg"></div>
</section>

<!-- 갤러리 -->
<main id="view" class="wrap">
  <div id="msg" class="msg"></div>
  <div id="list"></div>
</main>


<div id="commitbar" class="savebar hide">
  <button id="btnCommit" class="btn-primary">✅ 커밋 — 이 기준으로 작업 시작 (<span id="ncommit">0</span>)</button>
</div>

<script>
const OWNER='cool0720zzz', REPO='ye-in-project', API='https://api.github.com';
const MANIFEST='gallery/manifest.json', DECISIONS='gallery/decisions.json';
const $=s=>document.querySelector(s);
let token=localStorage.getItem('yein_tok')||'';
let items=[], choices={}, decSha=null, committedAt=null, baselineJson='';

const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function b64e(str){
  const bytes=new TextEncoder().encode(str); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function msg(el,text,kind){ el.className='msg show '+(kind||'info'); el.innerHTML=text; }
function hideMsg(el){ el.className='msg'; }
function show(v){ ['viewToken','view'].forEach(x=>$('#'+x).classList.add('hide')); $('#'+v).classList.remove('hide'); }

async function gh(path,opts){
  const r=await fetch(API+path,{...opts,headers:{
    'Authorization':'Bearer '+token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',
    ...(opts&&opts.headers||{})}});
  if(!r.ok){ let d=''; try{ d=(await r.json()).message||''; }catch(e){} throw new Error(`${r.status} ${d}`); }
  return r.json();
}

/* 토큰 */
$('#btnTok').onclick=()=>{ $('#tokIn').value=''; hideMsg($('#tokMsg')); show('viewToken'); };
$('#btnDelTok').onclick=()=>{ localStorage.removeItem('yein_tok'); token=''; msg($('#tokMsg'),'삭제했어요.','err'); };
$('#btnSaveTok').onclick=async()=>{
  const t=$('#tokIn').value.trim(); if(!t) return;
  token=t; localStorage.setItem('yein_tok',t);
  msg($('#tokMsg'),'저장했어요. 불러오는 중…','ok'); show('view'); load();
};

/* 목록 로드 */
async function load(){
  if(!token){ show('viewToken'); return; }
  show('view'); hideMsg($('#msg')); $('#list').innerHTML='';
  msg($('#msg'),'불러오는 중…','info');
  try{
    const d=await gh(`/repos/${OWNER}/${REPO}/contents/${MANIFEST}?ref=main&t=${Date.now()}`);
    const data=JSON.parse(b64d(d.content));
    items=data.items||[];
    // 기존 결정 로드 (있으면 미제출 선택 복원)
    choices={}; decSha=null;
    try{
      const dd=await gh(`/repos/${OWNER}/${REPO}/contents/${DECISIONS}?ref=main&t=${Date.now()}`);
      decSha=dd.sha; const dj=JSON.parse(b64d(dd.content));
      choices=dj.decisions||{}; committedAt=dj.committedAt||null;
      baselineJson=JSON.stringify(choices);
    }catch(e){/* 없을 수 있음 */}
    hideMsg($('#msg')); render();
  }catch(e){
    if(String(e).includes('404')) msg($('#msg'),'아직 결과가 없어요. 클로드가 첫 작업을 올리면 여기 떠요.','info');
    else if(String(e).includes('401')||String(e).includes('403')) { msg($('#msg'),'토큰이 필요하거나 만료됐어요.','err'); show('viewToken'); }
    else msg($('#msg'),'오류: '+e.message,'err');
  }
}

function render(){
  const list=$('#list');
  $('#count').textContent = items.length ? items.length+'개' : '';
  if(!items.length){ list.innerHTML='<div class="empty">아직 올라온 결과가 없어요.</div>'; return; }
  list.innerHTML='';
  const badge={image:['b-img','이미지'],loop:['b-loop','루프'],video:['b-video','리릭비디오'],lyricvideo:['b-video','리릭비디오']};
  items.forEach(it=>{
    const c=choices[it.id]||{};
    const bg=badge[it.type]||['b-img',it.type||'결과'];
    const card=document.createElement('div'); card.className='card';
    const statusHtml = it.status && it.status!=='new'
      ? `<span class="status st-${it.status}">${({reworking:'다시 작업 중',held:'보류',continued:'이어감',done:'완료'})[it.status]||it.status}</span>` : '';
    card.innerHTML=`
      ${it.thumb?`<img class="thumb" src="${it.thumb}" alt="">`:''}
      <div class="body">
        <div class="row1">
          <span class="badge ${bg[0]}">${bg[1]}</span>
          <span class="title">${it.title||it.id}</span>
          ${statusHtml}
        </div>
        <div class="verdict">${it.verdict||''}</div>
        <div class="meta">${it.created||''} · <code>${it.meta||''}</code></div>
        <div class="choices" data-id="${it.id}">
          <button data-ch="rework" class="${c.choice==='rework'?'sel-rework':''}">🔄 다시 작업</button>
          <button data-ch="hold" class="${c.choice==='hold'?'sel-hold':''}">⏸ 보류</button>
          ${it.final
            ? `<button data-ch="done" class="${c.choice==='done'?'sel-go':''}">✓ 완료</button>`
            : `<button data-ch="continue" class="${c.choice==='continue'?'sel-go':''}">▶ 이어가기</button>`}
        </div>
        <div class="notes ${c.choice==='rework'?'show':''}">
          <textarea placeholder="수정 사항을 적어주세요 (예: 배경 더 어둡게 / 가사 3번째 줄 타이밍 0.5초 늦게 / 얼굴 오른쪽 봐줘)" data-notes="${it.id}">${c.notes||''}</textarea>
        </div>
      </div>`;
    list.appendChild(card);
    card.querySelector('.choices').addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      const id=it.id, ch=b.dataset.ch;
      choices[id]={...(choices[id]||{}), choice:ch, ts:new Date().toISOString()};
      // 버튼 하이라이트
      card.querySelectorAll('.choices button').forEach(x=>x.className='');
      b.className = ch==='rework'?'sel-rework':ch==='hold'?'sel-hold':'sel-go';
      card.querySelector('.notes').classList.toggle('show', ch==='rework');
      scheduleSave(600);                       // 선택 즉시(짧은 디바운스) 자동 저장
    });
    const ta=card.querySelector('textarea');
    if(ta) ta.addEventListener('input',e=>{
      choices[it.id]={...(choices[it.id]||{}), notes:e.target.value};
      scheduleSave(1800);                      // 타이핑 멈추고 1.8초 뒤 저장
    });
  });
}

/* ── 2단계 저장: 선택·메모는 자동 '임시저장'(초안), [커밋]을 눌러야 작업 지시가 된다 ── */
let saveTimer=null, saving=false, dirtyAgain=false, pendingCommit=false;
function setStat(t){ $('#saveStat').textContent=t; }
function updateCommitBar(){
  const dirty = JSON.stringify(choices) !== baselineJson;
  const n = Object.values(choices).filter(c=>c.choice).length;
  $('#ncommit').textContent = n;
  $('#commitbar').classList.toggle('hide', !dirty || n===0);
}
function scheduleSave(delay){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>saveNow(false), delay); setStat('…'); updateCommitBar(); }
async function saveNow(commit){
  if(saving){ dirtyAgain=true; pendingCommit=pendingCommit||commit; return; }
  saving=true; setStat(commit?'커밋 중…':'임시저장 중…');
  if(commit) committedAt=new Date().toISOString();
  const payload={draft:!commit, committedAt, savedAt:new Date().toISOString(), decisions:choices};
  const mk=()=>{ const b={message:(commit?`갤러리 커밋 `:`갤러리 임시저장 `)+new Date().toISOString().slice(0,16),
    content:b64e(JSON.stringify(payload,null,2))}; if(decSha) b.sha=decSha; return b; };
  try{
    let r;
    try{ r=await gh(`/repos/${OWNER}/${REPO}/contents/${DECISIONS}`,{method:'PUT',body:JSON.stringify(mk())}); }
    catch(e){
      // sha 충돌(다른 기기/이전 커밋) → 최신 sha 다시 받아 1회 재시도
      if(String(e).includes('409')||String(e).includes('422')){
        try{ const d=await gh(`/repos/${OWNER}/${REPO}/contents/${DECISIONS}?ref=main&t=${Date.now()}`); decSha=d.sha; }catch(_){ decSha=null; }
        r=await gh(`/repos/${OWNER}/${REPO}/contents/${DECISIONS}`,{method:'PUT',body:JSON.stringify(mk())});
      } else throw e;
    }
    decSha=r.content.sha;
    const t=new Date(), hm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    if(commit){
      baselineJson=JSON.stringify(choices);
      setStat('✅ 커밋됨 '+hm); updateCommitBar();
      msg($('#msg'),'✅ 커밋 완료 — 클로드가 이 기준으로 작업을 시작합니다.','ok');
    } else setStat('임시저장 ✓ '+hm);
  }catch(e){ setStat('⚠️ 저장 실패'); msg($('#msg'),'저장 실패: '+e.message+' — 잠시 후 다시 시도해 주세요.','err'); }
  finally{ saving=false; if(dirtyAgain){ dirtyAgain=false; const c=pendingCommit; pendingCommit=false; setTimeout(()=>saveNow(c),400); } }
}
$('#btnCommit').onclick=()=>{ clearTimeout(saveTimer); saveNow(true); };

$('#btnReload').onclick=load;
load();
</script>
</body>
</html>
